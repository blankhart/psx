<div class="typeahead" data-testid="typeahead">
  <input data-testid="search" placeholder="Search fruit" type="text" value="pea">
  <p data-testid="status">
    "2 results"
  </p>
  <ul class="results">
    <li class="result selected" data-testid="result-0">
      "peach"
    </li>
    <li class="result" data-testid="result-1">
      "pear"
    </li>
  </ul>
  <p data-testid="chosen">
    "Chosen: blackberry"
  </p>
</div>
