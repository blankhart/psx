<section class="todo" data-testid="todo">
  <h1>
    "Todos"
  </h1>
  <div class="new">
    <input data-testid="draft" type="text" value>
    <button data-testid="add" disabled>
      "Add"
    </button>
  </div>
  <ul class="items">
    <li class="item">
      <input data-testid="toggle-3" type="checkbox">
      <span>
        "Run the suite"
      </span>
      <button data-testid="remove-3">
        "Remove"
      </button>
    </li>
  </ul>
  <p data-testid="left">
    "1 left"
  </p>
  <div class="filters">
    <button data-testid="all">
      "All"
    </button>
    <button data-testid="active" disabled>
      "Active"
    </button>
    <button data-testid="completed">
      "Completed"
    </button>
  </div>
</section>
