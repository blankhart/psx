<div class="container" data-testid="table">
  <div class="jumbotron">
    <div class="row">
      <div class="col-md-6">
        <h1>
          "PSX table"
        </h1>
      </div>
      <div class="col-md-6">
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="run" id="run" type="button">
            "Create 1,000 rows"
          </button>
        </div>
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="runlots" id="runlots" type="button">
            "Create 10,000 rows"
          </button>
        </div>
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="add" id="add" type="button">
            "Append 1,000 rows"
          </button>
        </div>
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="update" id="update" type="button">
            "Update every 10th row"
          </button>
        </div>
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="clear" id="clear" type="button">
            "Clear"
          </button>
        </div>
        <div class="col-sm-6 smallpad">
          <button class="btn btn-primary btn-block" data-testid="swaprows" id="swaprows" type="button">
            "Swap Rows"
          </button>
        </div>
      </div>
    </div>
  </div>
  <table class="table table-hover table-striped test-data">
    <tbody></tbody>
  </table>
  <span aria-hidden="true" class="preloadicon glyphicon glyphicon-remove"></span>
</div>
