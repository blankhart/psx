name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checkout token would shadow PSX_DEPS_TOKEN for other github.com repositories.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: VS Code extension activation and lifecycle
        run: xvfb-run -a npm run test:vscode

      - name: Package local VSIX
        run: npm run package:vscode

      - uses: actions/upload-artifact@v4
        with:
          name: psx-vscode
          path: editors/vscode/psx-vscode.vsix

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tree-sitter generation, corpus, queries and incremental edits
        run: |
          python3 -m pip install -r editors/tree-sitter-psx/test/requirements.txt
          npm run generate:tree-sitter
          git diff --exit-code -- editors/tree-sitter-psx
          npm run test:tree-sitter

      - name: TextMate scope assertions
        run: npm run test:textmate

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spago-nodejs
            .spago
          key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}
          restore-keys: spago-${{ runner.os }}-

      - name: Build every package
        run: npx spago build

      - name: Test every package
        run: npx spago test

      - name: VS Code real server features
        run: xvfb-run -a env PSX_VSCODE_REAL=1 npm run test:vscode

      - name: Language server stdio protocol and mapping
        run: |
          npm run test:language-server
          PSX_LSP_REAL=1 npm run test:language-server

      - name: Backends regenerate unchanged
        run: |
          node packages/psx-cli/bin/psx.mjs gen-backend
          git status --porcelain -- backends
          test -z "$(git status --porcelain -- backends)"

      - name: React examples lower unchanged and pass browser smoke tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run examples:react
          git diff --exit-code -- examples/react

      - name: psx check reports type errors in holes at their .psx positions
        run: sh test/check/run.sh

      - name: HTML table regenerates unchanged
        run: |
          npx spago run -p psx-html-data-generate
          git status --porcelain -- packages/psx-html-data
          test -z "$(git status --porcelain -- packages/psx-html-data)"

      # psx-cst must give cst-parser's tree on plain PureScript.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/psx-package-set
          key: package-set-${{ hashFiles('spago.yaml') }}

      - name: psx-cst matches cst-parser on the package set
        run: |
          packages/psx-cst/compare/fetch-package-set.sh ~/.cache/psx-package-set
          npx spago run -p psx-cst-compare -- ~/.cache/psx-package-set

      - name: Corpus goldens regenerate unchanged
        run: |
          find test/corpus -name 'expected.*' -delete
          npx spago run -p psx-corpus -- --accept
          git status --porcelain -- test/corpus
          test -z "$(git status --porcelain -- test/corpus)"
